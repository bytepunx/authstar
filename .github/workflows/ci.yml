name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    # Which service directories this push touched, so publish builds only those.
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            chronicle: [chronicle/**]
            herald: [herald/**]
            keep: [keep/**]
            lookout: [lookout/**]
            portcullis: [portcullis/**]
            steward: [steward/**]
            tower: [tower/**]
            web: [web/**]

  node:
    # Behavior and e2e tiers, exactly what each project's own `npm test` runs.
    # The integration tier needs Docker (testcontainers) and runs with `make integration`.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - chart/hook
          - chronicle
          - clients/typescript
          - herald
          - keep
          - lookout
          - steward
          - tower
          - web
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm test

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portcullis
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: portcullis
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  publish:
    # Builds and pushes an image for each service whose directory changed on main.
    # Tags are latest and the commit SHA; component version tags wait for the
    # release convention in design/conventions/git.md to name them.
    needs: [changes, node, rust]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v5
      # GitHub-hosted runners are amd64-only; arm64 images need QEMU so pulls
      # from an arm64 k3d cluster find a matching manifest. Portcullis stays
      # amd64-only because its emulated arm64 build is too slow.
      - uses: docker/setup-qemu-action@v3
        if: matrix.service != 'portcullis'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: bytepunx/authstar-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: ${{ matrix.service == 'portcullis' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
