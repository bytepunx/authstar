name: Verify signet manifest

# chart/manifest.json aggregates each service image's embedded signet manifest
# (ADR-0105); this checks it is current against the images on Docker Hub.

on:
  push:
    branches: [main]
    paths: [chart/**]
  pull_request:
    paths: [chart/**]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chart
    steps:
      - uses: actions/checkout@v5

      - name: Install yq
        run: |
          sudo curl -sL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install crane
        uses: imjasonh/setup-crane@v0.7

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check manifest.json is up to date
        run: node tools/aggregate-manifest.mjs --check
