name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Scoped to behavior + e2e only (npm's own `test` script, which builds first via
      # `pretest`) -- `test:integration` spins up real Postgres/RabbitMQ via testcontainers, and
      # this workflow has no verified-working Docker-in-Docker/testcontainers setup in this
      # repo's actual CI yet (see TESTING.md's own note that this tier "needs Docker running
      # locally / in CI"). Not silently dropped: it's deliberately out of this job's scope until
      # that's verified, same as lookout/chronicle's identical workflow.
      - run: npm test

  docker:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub-hosted runners are amd64-only; without QEMU + an explicit
      # platforms list, the pushed manifest has no arm64 variant and pulls
      # from an arm64 k3d cluster (e.g. authstar-integration on Apple
      # Silicon) fail with "no match for platform in manifest".
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/authstar-herald
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
