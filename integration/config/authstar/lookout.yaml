# Plain (non-secret) config for lookout.
#
# NOTE: as of this writing, lookout/src/server.ts has NO signet-client wiring
# at all — it reads LOOKOUT_RABBITMQ_URL directly from the process
# environment (with an explicit code comment flagging this as a stand-in).
#
# rabbitmqUrl deliberately NOT here even as a placeholder: it's a
# credential, and once lookout does adopt signet wiring, a
# `bundle.field ?? secrets.field`-shaped fallback (the pattern tower/keep/
# herald already use) would make this config value WIN over the real
# secrets/authstar/lookout/rabbitmqUrl.yaml value -- exactly the live bug
# found and fixed in tower/keep/herald's own config.yaml (stale guest/guest
# silently overriding a correctly-provisioned secret once config sync
# started working). Not worth reintroducing here pre-emptively.
