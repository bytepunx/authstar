# Plain (non-secret) config for portcullis, matching the Bundle struct in
# crates/authstar-config/src/bundle.rs exactly (#[serde(rename_all =
# "camelCase")] throughout — field names below are the literal wire keys,
# confirmed from the Rust struct definitions, not guessed from ADR 0014's
# skeleton). Per-tenant secret key material (session-key, internal-key,
# identity-hash-key-<n>, provider-<name>-client-secret) lives under
# secrets/authstar/portcullis/ instead — see secrets.rs's own comment that
# ProviderConfig deliberately has no client_secret field.
#
# towerUpstream is a judgment call (not explicitly named in the crate's
# original story digest per its own code comment) needed for /enrich and
# /identities/resolve east-west calls to tower.
webUpstream:
  address: http://web.authstar.svc.cluster.local:3000
  timeout: 10

# https, not http: tower's own server always runs real SPIFFE mTLS now
# (fetchServerCredentials() + a real https.Server, unconditional -- no
# plain-HTTP fallback, see tower's src/server.ts and src/lib/spiffe-mtls.ts).
# `tower_http_client` (authstar-middleware/src/state.rs) IS correctly
# mTLS-configured (use_preconfigured_tls, presents portcullis's own SVID),
# but reqwest only attempts a TLS handshake at all when the URL scheme
# itself says https:// -- a real gap this run found live: this repo's
# tower_http_client was never actually exercised end-to-end against
# tower's real TLS listener before now, and "http://" here silently made
# reqwest attempt a plain-TCP connection against a TLS-only port
# ("error sending request", no deeper detail, exactly this failure mode).
towerUpstream:
  address: https://tower.authstar.svc.cluster.local:8080
  timeout: 10

tenants:
  acme:
    status: active
    providers:
      dex:
        clientId: authstar
        discoveryUrl: http://dex.dex.svc.cluster.local:5556/.well-known/openid-configuration
        scope:
          - openid
          - email
    cookie:
      domain: acme.authstar.app
      path: /
      maxAge: 604800
      httpOnly: true
      secure: false
    jwt:
      issuer: https://acme.authstar.app
      audience: acme
      expiresIn: 168h
    branding:
      name: Acme Corp
      logoUrl: https://acme.authstar.app/logo.png
      primaryColor: "#1a73e8"
    identityHashKeyGenerations:
      - version: 1
        effectiveFrom: "2026-01-01T00:00:00Z"
    applications:
      web:
        hosts:
          - acme.authstar.app
          # tower's own tenant provisioning (POST /tenants) creates an
          # `_admin` application host at admin.<slug>.<baseDomain> for the
          # per-tenant JWKS convention (perTenantJwksKeyProvider) every
          # JWT-consuming service resolves against -- but that route only
          # writes tower's own actor state + pushes secrets, it never
          # patches portcullis's Bundle config with a matching host (no
          # `signetAdmin.patchConfig` call anywhere in provisioning.ts,
          # confirmed by grep -- only rotate-keys.ts uses patchConfig, for
          # EC key generation arrays). Host routing is a GitOps/deploy-time
          # concern this repo owns, not something tower auto-provisions.
          # JWKS resolution only needs the Host to resolve to *some* active
          # application for the right tenant (jwks_handler discards the
          # matched application, only reads tenant.internal_keys -- see
          # portcullis's endpoints/jwks.rs) -- no separate `_admin`
          # application block is needed, just this second host entry.
          - admin.acme.authstar.app
        server:
          publicUrl: https://acme.authstar.app
        upstream:
          base: http://web.authstar.svc.cluster.local:3000
          routes: {}
          timeout: 30
        cors:
          origin: https://acme.authstar.app
        exempt:
          - /healthz
        auth:
          loginUrl: /login
        providers:
          - dex
