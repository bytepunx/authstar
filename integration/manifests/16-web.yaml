# SIGNET_* bootstrap now set here (ADR 0102 / web story 012), enabling
# Signet-Configured Mode for web's plain config (towerBaseUrl/keepBaseUrl,
# sourced from config/authstar/web.yaml, overriding TOWER_BASE_URL/
# KEEP_BASE_URL below if both present) once web's own companion PR adds
# the dialWorkload/getServiceBundle wiring. Until then, web stays in
# today's Env-Only Mode unchanged (per ADR 0102, that mode remains
# legitimate for web). No SIGNET_ADMIN_ADDR: web makes no admin/GitOps
# calls.
#
# INTERNAL_JWT_JWKS_URL is now set for real (see
# config/authstar/web.yaml's own much longer comment on this exact field
# for the two remaining gaps -- portcullis has no JWKS route yet, and the
# admin.acme.authstar.app host has no in-cluster DNS path -- both flagged
# for operator verification before deploy, neither fixed by this value
# being set). KEEP_BASE_URL is added here too: used in code but was
# missing from this manifest entirely.
#
# PUBLIC_TOWER_BASE_URL is browser-visible ($env/dynamic/public) and only
# matters for a human driving the signup page directly; it assumes
# `kubectl port-forward svc/tower 8080:8080` on the tester's machine, not a
# real ingress. Scripted (non-browser) flows don't touch this value.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: authstar
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      serviceAccountName: web
      imagePullSecrets:
        - name: dockerhub-pull
      containers:
        - name: web
          image: bytepunx/authstar-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # TCP-only (no dedicated health route on any of these services yet):
          # confirmed for real that a service can be "1/1 Running" in
          # kubectl's eyes while its HTTP listener has actually stopped
          # accepting connections (a self-restart-on-signet-bundle-change
          # whose shutdown hung instead of exiting, observed live against
          # this exact cluster) -- with no probe at all, Kubernetes has no
          # way to detect or recover from that. A TCP probe at least catches
          # "port stopped accepting connections", which is what actually
          # happened.
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: SIGNET_NAMESPACE
              value: authstar
            - name: SIGNET_ADDR
              value: signet.signet.svc.cluster.local:8443
            - name: SIGNET_TRUST_DOMAIN
              value: authstar.cluster.local
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///run/spire/sockets/spire-agent.sock
            - name: TOWER_BASE_URL
              value: http://tower.authstar.svc.cluster.local:8080
            - name: KEEP_BASE_URL
              value: http://keep.authstar.svc.cluster.local:8080
            - name: INTERNAL_JWT_JWKS_URL
              value: https://admin.acme.authstar.app/.well-known/jwks.json
            - name: PUBLIC_TOWER_BASE_URL
              value: http://localhost:8080
          volumeMounts:
            - name: spiffe
              mountPath: /run/spire/sockets
              readOnly: true
      volumes:
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: authstar
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
