# No signet wiring yet (see config/authstar/lookout/config.yaml's own note)
# — no SPIFFE volume, no SIGNET_* env vars. Just the one env var its code
# actually reads.
#
# LOOKOUT_RABBITMQ_URL's credential is this specific cluster's live,
# randomly-generated broker credential, not guest/guest -- see
# scripts/lib-secrets.sh's header comment for how to read the current one
# and why guest/guest 403s (ACCESS_REFUSED) against a real broker. Reuses
# tower's own dedicated user rather than a separate lookout identity:
# lookout isn't in rabbitmqTargetServices (kluster-lib/profile/authstar.go,
# "today: tower, keep" per ADR 0008/0012), and tower's own Permission
# resource is a fully-permissive dev-only wildcard (configure/read/write:
# ".*", confirmed via `kubectl get permission.rabbitmq.com -n rabbitmq`),
# so sharing it works and needs no new topology-operator identity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lookout
  namespace: authstar
  labels:
    app: lookout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lookout
  template:
    metadata:
      labels:
        app: lookout
    spec:
      serviceAccountName: lookout
      imagePullSecrets:
        - name: dockerhub-pull
      containers:
        - name: lookout
          image: arobson/authstar-lookout:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # TCP-only (no dedicated health route on any of these services yet):
          # confirmed for real that a service can be "1/1 Running" in
          # kubectl's eyes while its HTTP listener has actually stopped
          # accepting connections (a self-restart-on-signet-bundle-change
          # whose shutdown hung instead of exiting, observed live against
          # this exact cluster) -- with no probe at all, Kubernetes has no
          # way to detect or recover from that. A TCP probe at least catches
          # "port stopped accepting connections", which is what actually
          # happened.
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: LOOKOUT_RABBITMQ_URL
              value: amqp://tower:7f2404f31f79db28f89d2feb3a175af5e52c80699ce083cd@rabbitmq.rabbitmq.svc.cluster.local:5672/authstar
---
apiVersion: v1
kind: Service
metadata:
  name: lookout
  namespace: authstar
spec:
  selector:
    app: lookout
  ports:
    - port: 3000
      targetPort: 3000
