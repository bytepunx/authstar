# No signet wiring yet (see config/authstar/chronicle/config.yaml's own
# note) — no SPIFFE volume, no SIGNET_* env vars, just the CHRONICLE_* env
# vars its own config.ts reads. Requires 01-db-init-job.yaml to have run
# first (creates the "chronicle" ClickHouse database).
#
# CHRONICLE_RABBITMQ_URL's credential is this specific cluster's live,
# randomly-generated broker credential, not guest/guest -- see
# scripts/lib-secrets.sh's header comment for how to read the current one
# and why guest/guest 403s (ACCESS_REFUSED) against a real broker. Reuses
# tower's own dedicated user rather than a separate chronicle identity:
# chronicle isn't in rabbitmqTargetServices (kluster-lib/profile/
# authstar.go, "today: tower, keep" per ADR 0008/0012), and tower's own
# Permission resource is a fully-permissive dev-only wildcard (configure/
# read/write: ".*", confirmed via `kubectl get permission.rabbitmq.com -n
# rabbitmq`), so sharing it works and needs no new topology-operator
# identity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronicle
  namespace: authstar
  labels:
    app: chronicle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chronicle
  template:
    metadata:
      labels:
        app: chronicle
    spec:
      serviceAccountName: chronicle
      imagePullSecrets:
        - name: dockerhub-pull
      containers:
        - name: chronicle
          image: arobson/authstar-chronicle:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # TCP-only (no dedicated health route on any of these services yet):
          # confirmed for real that a service can be "1/1 Running" in
          # kubectl's eyes while its HTTP listener has actually stopped
          # accepting connections (a self-restart-on-signet-bundle-change
          # whose shutdown hung instead of exiting, observed live against
          # this exact cluster) -- with no probe at all, Kubernetes has no
          # way to detect or recover from that. A TCP probe at least catches
          # "port stopped accepting connections", which is what actually
          # happened.
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: CHRONICLE_CLICKHOUSE_URL
              value: http://clickhouse.clickhouse.svc.cluster.local:8123
            - name: CHRONICLE_CLICKHOUSE_USERNAME
              value: default
            - name: CHRONICLE_CLICKHOUSE_PASSWORD
              value: clickhouse
            - name: CHRONICLE_CLICKHOUSE_DATABASE
              value: chronicle
            - name: CHRONICLE_RABBITMQ_URL
              value: amqp://tower:0ee655e69db3ef7d4b0cd8191a9ed1e554abec26d6406058@rabbitmq.rabbitmq.svc.cluster.local:5672/authstar
            - name: CHRONICLE_INTERNAL_JWT_SECRET
              value: dev-only-insecure-secret
---
apiVersion: v1
kind: Service
metadata:
  name: chronicle
  namespace: authstar
spec:
  selector:
    app: chronicle
  ports:
    - port: 3000
      targetPort: 3000
