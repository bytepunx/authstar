# SIGNET_* bootstrap now set here (ADR 0102 / chronicle story 003): this
# repo's own config/authstar/chronicle.yaml and secrets/authstar/chronicle/
# were already fully provisioned (matching ADR 0036's original list), but
# chronicle's own src/lib/config.ts/server.ts had never actually gained a
# signet dial to read them -- confirmed real, all thirteen settings were
# plain CHRONICLE_* process.env reads. Chronicle no longer has a shared JWT
# secret: it verifies the ES256 internal JWT against the tenant's JWKS, with
# towerBaseUrl from config/authstar/chronicle.yaml (S-0009).
# Chronicle's own companion PR (story 003) adds the dialWorkload/
# getServiceBundle wiring keep/herald/tower already use; this manifest
# change is only safe/backward-compatible once that PR has merged (see
# this repo's own PR description for the exact merge-order dependency) --
# until then, chronicle will crash on startup: presence of SIGNET_ADDR
# alone doesn't help it if its own code doesn't yet dial signet with it.
# SIGNET_ADMIN_ADDR is set per story 003's explicit bootstrap-surface list,
# on the workload port 8443 as tower/keep/herald's is (their GitOps writes
# go over workload mTLS since ADR 0103), even though chronicle's own code
# doesn't yet make any admin/GitOps calls -- harmless if unused, and saves
# a second manifest edit if it later needs one (e.g. its own
# signetAdminToken push), same reasoning as its inclusion in every other
# service's bootstrap set here.
#
# Requires 01-db-init-job.yaml to have run first (creates the "chronicle"
# ClickHouse database).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronicle
  namespace: authstar
  labels:
    app: chronicle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chronicle
  template:
    metadata:
      labels:
        app: chronicle
    spec:
      serviceAccountName: chronicle
      imagePullSecrets:
        - name: dockerhub-pull
      containers:
        - name: chronicle
          image: bytepunx/authstar-chronicle:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # TCP-only (no dedicated health route on any of these services yet):
          # confirmed for real that a service can be "1/1 Running" in
          # kubectl's eyes while its HTTP listener has actually stopped
          # accepting connections (a self-restart-on-signet-bundle-change
          # whose shutdown hung instead of exiting, observed live against
          # this exact cluster) -- with no probe at all, Kubernetes has no
          # way to detect or recover from that. A TCP probe at least catches
          # "port stopped accepting connections", which is what actually
          # happened.
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: SIGNET_NAMESPACE
              value: authstar
            - name: SIGNET_ADDR
              value: signet.signet.svc.cluster.local:8443
            - name: SIGNET_ADMIN_ADDR
              value: signet.signet.svc.cluster.local:8443
            - name: SIGNET_TRUST_DOMAIN
              value: authstar.cluster.local
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///run/spire/sockets/spire-agent.sock
            # Chronicle's plain fetch() to tower's https towerBaseUrl has no
            # SPIFFE-bundle CA trust wiring yet, as in the chart (I-0001).
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
          volumeMounts:
            - name: spiffe
              mountPath: /run/spire/sockets
              readOnly: true
      volumes:
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: chronicle
  namespace: authstar
spec:
  selector:
    app: chronicle
  ports:
    - port: 3000
      targetPort: 3000
