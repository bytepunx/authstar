# No signet wiring yet, no SPIFFE volume. Steward never holds an operator
# bearer token itself (ADR 0045/0048) -- a human types tower's operatorToken
# secret into steward's own Connect UI each session, so nothing here needs
# to source that secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steward
  namespace: authstar
  labels:
    app: steward
spec:
  replicas: 1
  selector:
    matchLabels:
      app: steward
  template:
    metadata:
      labels:
        app: steward
    spec:
      serviceAccountName: steward
      imagePullSecrets:
        - name: dockerhub-pull
      containers:
        - name: steward
          image: bytepunx/authstar-steward:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # TCP-only (no dedicated health route on any of these services yet):
          # confirmed for real that a service can be "1/1 Running" in
          # kubectl's eyes while its HTTP listener has actually stopped
          # accepting connections (a self-restart-on-signet-bundle-change
          # whose shutdown hung instead of exiting, observed live against
          # this exact cluster) -- with no probe at all, Kubernetes has no
          # way to detect or recover from that. A TCP probe at least catches
          # "port stopped accepting connections", which is what actually
          # happened.
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: TOWER_URL
              value: http://tower.authstar.svc.cluster.local:8080
            - name: HERALD_URL
              value: http://herald.authstar.svc.cluster.local:8080
---
apiVersion: v1
kind: Service
metadata:
  name: steward
  namespace: authstar
spec:
  selector:
    app: steward
  ports:
    - port: 3000
      targetPort: 3000
