# SIGNET_ADMIN_ADDR is set for the same reason as tower's (see 10-tower.yaml's
# header comment): keep's signet-admin.ts wiring also calls signet's
# GitOpsService on the admin port (8444), not the workload port (8443).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keep
  namespace: authstar
  labels:
    app: keep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keep
  template:
    metadata:
      labels:
        app: keep
    spec:
      serviceAccountName: keep
      imagePullSecrets:
        - name: dockerhub-pull
      containers:
        - name: keep
          image: bytepunx/authstar-keep:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          # TCP-only (no dedicated health route on any of these services yet):
          # confirmed for real that a service can be "1/1 Running" in
          # kubectl's eyes while its HTTP listener has actually stopped
          # accepting connections (a self-restart-on-signet-bundle-change
          # whose shutdown hung instead of exiting, observed live against
          # this exact cluster) -- with no probe at all, Kubernetes has no
          # way to detect or recover from that. A TCP probe at least catches
          # "port stopped accepting connections", which is what actually
          # happened.
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: SIGNET_NAMESPACE
              value: authstar
            - name: SIGNET_ADDR
              value: signet.signet.svc.cluster.local:8443
            - name: SIGNET_ADMIN_ADDR
              value: signet.signet.svc.cluster.local:8444
            - name: SIGNET_TRUST_DOMAIN
              value: authstar.cluster.local
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///run/spire/sockets/spire-agent.sock
          volumeMounts:
            - name: spiffe
              mountPath: /run/spire/sockets
              readOnly: true
      volumes:
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: keep
  namespace: authstar
spec:
  selector:
    app: keep
  ports:
    - port: 8080
      targetPort: 8080
