# Retention purge scheduled sweep (ADR 0029: "the same operational shape
# as ADR 0012's provisioner CronJob") -- confirmed directly against
# kluster's own rabbitmq-provisioner CronJob (kluster-lib/profile/
# authstar.go's rabbitmqProvisionerCronJobManifest/rabbitmqProvisionerPodSpec)
# before writing, matching keep's own analogous pricing-sync CronJob
# (11-keep-pricing-sync-cronjob.yaml) in this same directory -- same
# spec.schedule/timeZone shape, same restartPolicy: OnFailure choice and
# reasoning (below), same "reuse the owning service's own image/
# ServiceAccount, no separate identity" posture, since this job never
# touches the Kubernetes API, only signet (its own bundle) and Postgres.
#
# The container command overrides the image's default `CMD ["node",
# "dist/server.js"]` to run `dist/purge-retention.js` instead (compiled
# from src/purge-retention.ts, part of the same build -- no second image).
#
# restartPolicy: OnFailure, not the more common Never: SPIRE registers a
# workload's SPIFFE identity per *Pod*, and that registration needs a few
# seconds to propagate to the node-local SPIRE agent this pod dials over
# the CSI socket. With restartPolicy: Never, each retry gets an entirely
# new Pod object and re-hits the same fresh-registration race; OnFailure
# restarts the failed container in place, inside the same already-
# registered Pod.
#
# No Helm chart exists anywhere in this workspace for any authstar service
# (confirmed directly, not assumed, building keep's own equivalent job) --
# this is plain, applied-as-is YAML like every other manifest here.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: herald-retention-purge
  namespace: authstar
spec:
  # Daily, two hours after the RabbitMQ credential rotation CronJob's 3 AM
  # slot and one hour after keep's own pricing-sync CronJob's 4 AM slot --
  # avoids the three scheduled jobs contending for cluster resources at the
  # same instant, though none of them is resource-heavy enough for this to
  # be load-bearing.
  schedule: "0 5 * * *"
  timeZone: "America/New_York"
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: herald-retention-purge
        spec:
          serviceAccountName: herald
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: dockerhub-pull
          containers:
            - name: herald-retention-purge
              image: bytepunx/authstar-herald:latest
              imagePullPolicy: Always
              command: ["node", "dist/purge-retention.js"]
              env:
                - name: SIGNET_NAMESPACE
                  value: authstar
                - name: SIGNET_ADDR
                  value: signet.signet.svc.cluster.local:8443
                - name: SIGNET_TRUST_DOMAIN
                  value: authstar.cluster.local
                - name: SPIFFE_ENDPOINT_SOCKET
                  value: unix:///run/spire/sockets/spire-agent.sock
              volumeMounts:
                - name: spiffe
                  mountPath: /run/spire/sockets
                  readOnly: true
          volumes:
            - name: spiffe
              csi:
                driver: csi.spiffe.io
                readOnly: true
