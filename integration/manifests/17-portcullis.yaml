# Fixed listen port 3710 (crates/authstar-proxy/src/main.rs's LISTEN_PORT
# constant -- no PORT env var support, unlike the Node services). SPIFFE_SOCKET
# is a bare path here (not a unix:// URI like the Node services'
# SPIFFE_ENDPOINT_SOCKET) -- authstar-config/src/env.rs normalizes it itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portcullis
  namespace: authstar
  labels:
    app: portcullis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portcullis
  template:
    metadata:
      labels:
        app: portcullis
    spec:
      serviceAccountName: portcullis
      imagePullSecrets:
        - name: dockerhub-pull
      containers:
        - name: portcullis
          image: arobson/authstar-portcullis:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3710
          env:
            - name: SIGNET_NAMESPACE
              value: authstar
            - name: SIGNET_SERVICE
              value: portcullis
            - name: SIGNET_ADDR
              value: signet.signet.svc.cluster.local:8443
            - name: SIGNET_TRUST_DOMAIN
              value: authstar.cluster.local
            - name: SPIFFE_SOCKET
              value: /run/spire/sockets/spire-agent.sock
          volumeMounts:
            - name: spiffe
              mountPath: /run/spire/sockets
              readOnly: true
      volumes:
        - name: spiffe
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: portcullis
  namespace: authstar
spec:
  selector:
    app: portcullis
  ports:
    - port: 3710
      targetPort: 3710
