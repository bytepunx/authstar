name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Full suite: like steward, web's integration tier has no testcontainers/real-database
      # dependency to gate on -- per TESTING.md, web owns no persistent state of its own, so
      # `test:integration` points the real tower HTTP client at a plain node:http fake-tower
      # fixture (no Docker needed). `npm run test:all` covers all four tiers (behavior +
      # components + integration + e2e); `pretest:e2e` builds the widget bundle and the e2e
      # webServer config builds the admin app itself, so no separate build step is needed here.
      - run: npm run test:all

  docker:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub-hosted runners are amd64-only; without QEMU + an explicit
      # platforms list, the pushed manifest has no arm64 variant and pulls
      # from an arm64 k3d cluster (e.g. authstar-integration on Apple
      # Silicon) fail with "no match for platform in manifest".
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: bytepunx/authstar-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
