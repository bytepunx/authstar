version: 1
name: "authstar"
key: "auth"
description: "authentication and authorization"
owner: "bytepunx"
repo: "https://github.com/bytepunx/authstar"
template:
  repo: "https://github.com/bytepunx/system-flow-template"
  ref: "v1.0.16"
  version: "1.0.16"
  applied: 2026-10-21T04:59:56Z
layout:
  design: design
  docs: docs
  wip: wip
projects:
