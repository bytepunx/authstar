version: 1
name: "authstar"
key: "auth"
description: "authentication and authorization"
owner: "bytepunx"
repo: "https://github.com/bytepunx/authstar"
template:
  repo: "https://github.com/bytepunx/system-flow-template"
  ref: "v1.1.24"
  version: "1.1.24"
  applied: 2026-11-15T07:11:21Z
layout:
  design: design
  docs: docs
  wip: wip
projects:
  - name: hook
    path: chart/hook
    kind: node
  - name: chronicle
    path: chronicle
    kind: node
  - name: typescript
    path: clients/typescript
    kind: node
  - name: core
    path: clients/typescript/core
    kind: node
  - name: fastify
    path: clients/typescript/fastify
    kind: node
  - name: herald
    path: herald
    kind: node
  - name: integration
    path: integration
    kind: shell
  - name: keep
    path: keep
    kind: node
  - name: lookout
    path: lookout
    kind: node
  - name: portcullis
    path: portcullis
    kind: rust
  - name: steward
    path: steward
    kind: sveltekit
  - name: tower
    path: tower
    kind: node
  - name: web
    path: web
    kind: sveltekit
dashboard:
  image: ghcr.io/bytepunx/flaiover
  tag: latest
  port: 4242
  bind: 0.0.0.0 # 127.0.0.1 to keep the dashboard on this host only
agent:
  harness: claude-code
  model: claude-opus-5-5
  config:
    effort: high
planning:
  hour_rate: 150
kluster:
  config: integration/kluster.yaml
  namespace: authstar
  components:
    - name: tower
      build: [scripts/kluster-build.sh, tower]
    - name: keep
      build: [scripts/kluster-build.sh, keep]
    - name: herald
      build: [scripts/kluster-build.sh, herald]
    - name: lookout
      build: [scripts/kluster-build.sh, lookout]
    - name: chronicle
      build: [scripts/kluster-build.sh, chronicle]
    - name: steward
      build: [scripts/kluster-build.sh, steward]
    - name: web
      build: [scripts/kluster-build.sh, web]
    - name: portcullis
      build: [scripts/kluster-build.sh, portcullis]
  deploy: [scripts/kluster-deploy.sh]
  teardown: [scripts/kluster-teardown.sh]
  timeout: 30m
tests:
  - name: hook
    command: [scripts/test.sh, chart/hook]
    paths: ["chart/hook/**", scripts/test.sh, scripts/lib-projects.sh]
    format: plain
  - name: typescript
    command: [scripts/test.sh, clients/typescript]
    paths: ["clients/typescript/**", scripts/test.sh, scripts/lib-projects.sh]
    format: plain
  - name: chronicle
    command: [scripts/test.sh, chronicle]
    paths: ["chronicle/**", scripts/test.sh, scripts/lib-projects.sh]
    format: plain
  - name: lookout
    command: [scripts/test.sh, lookout]
    paths: ["lookout/**", scripts/test.sh, scripts/lib-projects.sh]
    format: plain
  - name: herald
    command: [scripts/test.sh, herald]
    paths: ["herald/**", scripts/test.sh, scripts/lib-projects.sh]
    format: plain
  - name: keep
    command: [scripts/test.sh, keep]
    paths: ["keep/**", scripts/test.sh, scripts/lib-projects.sh]
    format: plain
  - name: tower
    command: [scripts/test.sh, tower]
    paths: ["tower/**", scripts/test.sh, scripts/lib-projects.sh]
    format: plain
  - name: steward
    command: [scripts/test.sh, steward]
    paths: ["steward/**", scripts/test.sh, scripts/lib-projects.sh]
    format: plain
  - name: web
    command: [scripts/test.sh, web]
    paths: ["web/**", scripts/test.sh, scripts/lib-projects.sh]
    format: plain
  - name: portcullis
    command: [scripts/test.sh, portcullis]
    paths: ["portcullis/**", scripts/test.sh, scripts/lib-projects.sh]
    format: plain
