    path: clients/typescript/fastify
    kind: node
  - name: herald
    path: herald
    kind: node
  - name: keep
    path: keep
    kind: node
  - name: lookout
    path: lookout
    kind: node
  - name: portcullis
    path: portcullis
    kind: rust
  - name: steward
    path: steward
    kind: sveltekit
  - name: tower
    path: tower
    kind: node
  - name: web
    path: web
    kind: sveltekit
dashboard:
  image: ghcr.io/bytepunx/flaiover
  tag: latest
  port: 4242
