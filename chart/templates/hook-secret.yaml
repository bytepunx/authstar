# Secrets for all 8 services, templated straight from values.<service>.secrets
# and mounted into the hook Job as a Secret volume (base64-at-rest, unlike a
# ConfigMap) -- not a strong guarantee (see README's "Secrets in values.yaml"
# section and Story 001's Notes: plaintext secret material still transits
# `helm install`/`upgrade`'s process memory and the stored release object
# either way), but strictly better than putting the same content in a
# ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "authstar-chart.fullname" . }}-authstar-hook-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "authstar-chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  secrets.json: |
    {{- $result := dict }}
    {{- range $name := list "chronicle" "herald" "keep" "lookout" "portcullis" "steward" "tower" "web" }}
    {{- $svc := index $.Values $name }}
    {{- $entry := dict "signetNamespace" $svc.signet.namespace "signetService" $name "secrets" $svc.secrets }}
    {{- $noop := set $result $name $entry }}
    {{- end }}
    {{ dict "services" $result | toJson | nindent 4 }}
