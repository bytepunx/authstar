# SIGNET_ADMIN_ADDR: keep's signet-admin.ts wiring also calls signet's
# GitOpsService on the admin port (8444), not the workload port (8443) --
# same reasoning as tower's own deployment. dbConnectionString/rabbitmqUrl/
# stripe keys/etc. are delivered via keep's own signet bundle, pushed by
# this chart's provisioning hook -- not env vars here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keep
  namespace: {{ .Release.Namespace }}
  labels:
    app: keep
spec:
  replicas: {{ .Values.keep.replicas }}
  selector:
    matchLabels:
      app: keep
  template:
    metadata:
      labels:
        app: keep
    spec:
      serviceAccountName: keep
      {{- include "authstar.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: keep
          image: "{{ .Values.keep.image.repository }}:{{ .Values.keep.image.tag }}"
          imagePullPolicy: {{ .Values.keep.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.keep.port }}
          {{- include "authstar.probes" .Values.keep.port | nindent 10 }}
          {{- include "authstar.resources" .Values.keep.resources | nindent 10 }}
          env:
            - name: SIGNET_NAMESPACE
              value: {{ .Values.keep.signet.namespace | quote }}
            - name: SIGNET_ADDR
              value: {{ .Values.keep.signet.addr | quote }}
            - name: SIGNET_ADMIN_ADDR
              value: {{ .Values.keep.signet.adminAddr | quote }}
            - name: SIGNET_TRUST_DOMAIN
              value: {{ .Values.keep.signet.trustDomain | quote }}
            - name: SPIFFE_ENDPOINT_SOCKET
              value: {{ .Values.keep.spiffe.socketValue | quote }}
            {{- include "authstar.extraEnv" .Values.keep.extraEnv | nindent 12 }}
          volumeMounts:
            {{- include "authstar.spiffeVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "authstar.spiffeVolume" . | nindent 8 }}
