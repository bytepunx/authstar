name: Publish @bytepunx/authstar-fastify

on:
  push:
    tags:
      - "fastify-v*"
  # Lets a maintainer re-run a publish for an existing tag (e.g. after fixing
  # Trusted Publishing setup) without deleting and re-pushing the tag itself
  # -- dispatch with --ref <tag> to check out and publish that exact tag.
  workflow_dispatch: {}

permissions:
  contents: read
  # Required for npm Trusted Publishing (OIDC) -- npm exchanges this job's
  # GitHub-issued OIDC token for a short-lived publish credential itself, so
  # there's no long-lived NPM_TOKEN secret to store, rotate, or have expire
  # out from under a release. Requires the package to have a Trusted
  # Publisher configured on npmjs.com pointing at this exact repo + workflow
  # file (bytepunx/authstar-clients, publish-fastify.yml) -- a one-time,
  # npm-website-side setup step for an @bytepunx package owner, not
  # something expressible in this file.
  id-token: write

jobs:
  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
          registry-url: "https://registry.npmjs.org"

      - name: npm ci
        working-directory: typescript
        run: npm ci

      # fastify's build bundles core's compiled dist directly in (see
      # tsup.config.ts's noExternal) -- core has to be built first, same as
      # ci.yml's own `npm run build -w core && npm run test --workspaces`.
      - name: Build core (dependency for bundling)
        working-directory: typescript
        run: npm run build -w core

      - name: Build
        working-directory: typescript/fastify
        run: npm run build

      - name: Test
        working-directory: typescript/fastify
        run: npm test

      - name: Verify core is fully bundled, not left as an external dependency
        working-directory: typescript/fastify
        run: |
          if grep -q '@bytepunx/authstar-core' dist/index.js; then
            echo "::error::dist/index.js still references @bytepunx/authstar-core externally -- bundling failed, see tsup.config.ts noExternal"
            exit 1
          fi

      - name: Update npm CLI
        # Trusted Publishing's OIDC exchange requires npm >= 11.5.1; Node
        # 22's bundled npm predates that, so pin an explicit floor here
        # rather than relying on whatever ships with the runner's Node.
        run: npm install -g npm@^11.5.1

      - name: Publish to npm
        working-directory: typescript/fastify
        # @bytepunx/authstar-fastify is a scoped package; scoped packages
        # default to private on npm, so --access public is required or the
        # publish is rejected outright. No NODE_AUTH_TOKEN here -- with a
        # Trusted Publisher configured, npm authenticates this publish via
        # the OIDC token from id-token: write above, not a stored secret.
        run: npm publish --access public
